name = "sbm-lael-prototype"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./ui"
binding = "ASSETS"
run_worker_first = true

[vars]
OPENAI_MODEL = "gpt-5.4-mini"
LAEL_OWNER_ID = "owner"

[[durable_objects.bindings]]
name = "LAEL_WORKSPACES"
class_name = "LaelWorkspace"

[[migrations]]
tag = "lael-prototype-v1"
new_sqlite_classes = ["LaelWorkspace"]
